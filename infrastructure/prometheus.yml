global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nifi'
    scrape_interval: 5s
    metrics_path: '/metrics'
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ['nifi:9088']